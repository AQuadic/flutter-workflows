name: Flutter Android Build

on:
  workflow_call:
    inputs:
      app-name:
        description: 'New App Name to rename (optional)'
        required: false
        type: string
      bundle-id:
        description: 'New Android Package Name (optional)'
        required: false
        type: string
      enable-obfuscation:
        description: 'Enable obfuscation for AAB'
        required: false
        type: boolean
        default: true
      find-replace-list:
        description: |
          Multiple find & replace operations (one per line)
          Format: path|find_text|replace_text
          Example:
            lib/config|old_url|new_url
            lib/main.dart|OldApp|NewApp
            android|com.old.package|com.new.package
        required: false
        type: string
      firebase-project-id:
        description: 'Firebase Project ID for configuration'
        required: false
        type: string
      icon-url:
        description: 'URL to download the app icon (png)'
        required: false
        type: string
      java-version:
        description: 'Java version to use'
        required: false
        type: string
        default: '17'
      pre-build-script:
        description: 'Script to run before the build process (e.g. "./scripts/prepare.sh")'
        required: false
        type: string
      run-tests:
        description: 'Run unit tests before building if tests exist'
        required: false
        type: boolean
        default: true
      runner-type:
        description: 'Runner type to use'
        required: false
        type: string
        default: 'self-hosted'

    secrets:
      FIREBASE_SERVICE_ACCOUNT:
        description: 'Firebase Service Account JSON (optional)'
        required: false
      KEY_ALIAS:
        description: 'Key alias (optional)'
        required: false
      KEY_PASSWORD:
        description: 'Key password (optional)'
        required: false
      KEYSTORE_PASSWORD:
        description: 'Keystore password (optional)'
        required: false
      PAT_TOKEN:
        description: 'Personal Access Token for private Git dependencies (optional)'
        required: false

jobs:
  android-build:
    runs-on: ${{ inputs.runner-type || 'self-hosted' }}
    
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: 'zulu'
          java-version: ${{ inputs.java-version }}

      - name: Configure FVM
        uses: kuhnroyal/flutter-fvm-config-action/config@v3
        id: fvm-config-action

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ steps.fvm-config-action.outputs.FLUTTER_VERSION }}
          channel: ${{ steps.fvm-config-action.outputs.FLUTTER_CHANNEL }}
          cache: false

      - name: Flutter version
        run: flutter --version

      - name: Run Pre-Build Script
        if: ${{ inputs.pre-build-script != '' }}
        run: ${{ inputs.pre-build-script }}

      - name: Rename App
        if: ${{ inputs.app-name != '' }}
        run: |
          dart pub global activate rename
          export PATH="$PATH":"$HOME/.pub-cache/bin"
          dart pub global run rename setAppName --value "${{ inputs.app-name }}" --targets android

      - name: Change Android Package Name
        if: ${{ inputs.bundle-id != '' }}
        run: |
          dart pub global activate change_app_package_name
          export PATH="$PATH":"$HOME/.pub-cache/bin"
          dart pub global run change_app_package_name:main ${{ inputs.bundle-id }}

      - name: Detect Bundle ID
        id: detect-bundle
        run: |
          if [ -n "${{ inputs.bundle-id }}" ]; then
            PACKAGE_NAME="${{ inputs.bundle-id }}"
            echo "✓ Using provided bundle-id: $PACKAGE_NAME"
          else
            echo "🔍 Attempting to detect bundle ID from project files..."
            PACKAGE_NAME=""
          
            # محاولة 1: استخراج من build.gradle
            if [ -f "android/app/build.gradle" ]; then
              echo "📄 Found android/app/build.gradle"
          
              echo "--- Searching for applicationId ---"
              grep -i "applicationId" android/app/build.gradle || true
          
              PACKAGE_NAME=$(grep -oP 'applicationId\s*["\x27]\K[^"\x27]+' android/app/build.gradle 2>/dev/null | head -n 1)
          
              if [ -z "$PACKAGE_NAME" ]; then
                PACKAGE_NAME=$(grep -oP 'applicationId\s*=\s*["\x27]\K[^"\x27]+' android/app/build.gradle 2>/dev/null | head -n 1)
              fi
          
              if [ -z "$PACKAGE_NAME" ]; then
                PACKAGE_NAME=$(grep -oP 'applicationId\s+"\K[^"]+' android/app/build.gradle 2>/dev/null | head -n 1)
              fi
          
              if [ -n "$PACKAGE_NAME" ]; then
                echo "✓ Found in build.gradle: $PACKAGE_NAME"
              fi
            else
              echo "⚠ android/app/build.gradle not found"
            fi
          
            # محاولة 2: استخراج من build.gradle.kts (Kotlin DSL)
            if [ -z "$PACKAGE_NAME" ] && [ -f "android/app/build.gradle.kts" ]; then
              echo "📄 Found android/app/build.gradle.kts"
          
              echo "--- Searching for applicationId in Kotlin DSL ---"
              grep -i "applicationId" android/app/build.gradle.kts || true
          
              PACKAGE_NAME=$(grep -oP 'applicationId\s*=\s*"\K[^"]+' android/app/build.gradle.kts 2>/dev/null | head -n 1)
          
              if [ -n "$PACKAGE_NAME" ]; then
                echo "✓ Found in build.gradle.kts: $PACKAGE_NAME"
              fi
            fi
          
            # محاولة 3: استخراج من AndroidManifest.xml
            if [ -z "$PACKAGE_NAME" ] && [ -f "android/app/src/main/AndroidManifest.xml" ]; then
              echo "📄 Found AndroidManifest.xml"
          
              echo "--- Searching for package in AndroidManifest ---"
              grep -i "package=" android/app/src/main/AndroidManifest.xml || true
          
              PACKAGE_NAME=$(grep -oP 'package="\K[^"]+' android/app/src/main/AndroidManifest.xml 2>/dev/null | head -n 1)
          
              if [ -n "$PACKAGE_NAME" ]; then
                echo "✓ Found in AndroidManifest.xml: $PACKAGE_NAME"
              fi
            else
              echo "⚠ AndroidManifest.xml not found"
            fi
          
            # محاولة 4: استخراج من pubspec.yaml
            if [ -z "$PACKAGE_NAME" ] && [ -f "pubspec.yaml" ]; then
              echo "📄 Checking pubspec.yaml"
              PACKAGE_NAME=$(grep -oP 'package_name:\s*\K.+' pubspec.yaml 2>/dev/null | tr -d ' "' | head -n 1)
          
              if [ -n "$PACKAGE_NAME" ]; then
                echo "✓ Found in pubspec.yaml: $PACKAGE_NAME"
              fi
            fi
          
            if [ -z "$PACKAGE_NAME" ]; then
              PACKAGE_NAME="app"
              echo "⚠ Bundle ID not found, using default: $PACKAGE_NAME"
            else
              echo "✅ Successfully detected bundle-id: $PACKAGE_NAME"
            fi
          fi
          
          echo "bundle-id=$PACKAGE_NAME" >> $GITHUB_OUTPUT
          echo "BUNDLE_ID=$PACKAGE_NAME" >> $GITHUB_ENV
          echo "📦 Final Bundle ID: $PACKAGE_NAME"

      - name: Update App Icon from URL
        if: ${{ inputs.icon-url != '' }}
        run: |
          dart pub global activate flutter_launcher_icons
          export PATH="$PATH":"$HOME/.pub-cache/bin"

          TEMP_ICON_DIR=".temp_icons"
          mkdir -p "$TEMP_ICON_DIR"
          TEMP_ICON_PATH="$TEMP_ICON_DIR/icon.png"
          
          echo "Downloading icon from: ${{ inputs.icon-url }}"
          if command -v curl &> /dev/null; then
            curl -L -o "$TEMP_ICON_PATH" "${{ inputs.icon-url }}"
          elif command -v wget &> /dev/null; then
            wget -O "$TEMP_ICON_PATH" "${{ inputs.icon-url }}"
          else
            echo "Error: Neither curl nor wget found"
            exit 1
          fi
          
          if [ ! -f "$TEMP_ICON_PATH" ]; then
            echo "Failed to download icon"
            exit 1
          fi
          
          cat > flutter_launcher_icons_temp.yaml <<EOF
          flutter_launcher_icons:
            android: true
            ios: false
            image_path: "$TEMP_ICON_PATH"
            remove_alpha_ios: true
            adaptive_icon_background: "#ffffff"
            adaptive_icon_foreground: "$TEMP_ICON_PATH"
          EOF
          
          dart pub global run flutter_launcher_icons -f flutter_launcher_icons_temp.yaml
          
          rm -f flutter_launcher_icons_temp.yaml
          rm -rf "$TEMP_ICON_DIR"

      - name: Detect Firebase Project ID
        id: detect-firebase
        run: |
          PROJECT_ID="${{ inputs.firebase-project-id }}"

          if [ -z "$PROJECT_ID" ]; then
            # Try .firebaserc first (projects.default)
            if [ -f ".firebaserc" ] && command -v jq &>/dev/null; then
              PROJECT_ID=$(jq -r '.projects.default // empty' .firebaserc 2>/dev/null || true)
              if [ -n "$PROJECT_ID" ]; then
                echo "✅ Auto-detected Firebase project from .firebaserc: $PROJECT_ID"
              fi
            fi
          fi

          if [ -z "$PROJECT_ID" ]; then
            # Try firebase.json — search for any projectId field (works with flutterfire, hosting, etc.)
            if [ -f "firebase.json" ] && command -v jq &>/dev/null; then
              PROJECT_ID=$(jq -r 'first(.. | .projectId? | select(type == "string" and length > 0)) // empty' firebase.json 2>/dev/null || true)
              if [ -n "$PROJECT_ID" ]; then
                echo "✅ Auto-detected Firebase project from firebase.json: $PROJECT_ID"
              fi
            fi
          fi

          if [ -z "$PROJECT_ID" ] && [ -f "firebase.json" ]; then
            echo "ℹ firebase.json found but could not extract project ID. Provide firebase-project-id input or add a default alias in .firebaserc."
          fi

          echo "project-id=$PROJECT_ID" >> "$GITHUB_OUTPUT"

      - name: Setup Node.js
        if: ${{ steps.detect-firebase.outputs.project-id != '' }}
        uses: actions/setup-node@v7
        with:
          node-version: '24'

      - name: Configure Firebase
        if: ${{ steps.detect-firebase.outputs.project-id != '' }}
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: |
          if [ -z "$FIREBASE_SERVICE_ACCOUNT" ]; then
            echo "⚠ Warning: Firebase Project ID provided, but FIREBASE_SERVICE_ACCOUNT secret is empty. Skipping..."
            exit 0
          fi
          
          npm install -g firebase-tools
          dart pub global activate flutterfire_cli
          export PATH="$PATH":"$HOME/.pub-cache/bin"
          
          echo "$FIREBASE_SERVICE_ACCOUNT" > $HOME/service-account.json
          export GOOGLE_APPLICATION_CREDENTIALS="$HOME/service-account.json"
          
          flutterfire configure \
            --yes \
            --project=${{ steps.detect-firebase.outputs.project-id }} \
            --platforms=android \
            --android-package-name=${{ steps.detect-bundle.outputs.bundle-id }}

      - name: Find and Replace Text
        if: ${{ inputs.find-replace-list != '' }}
        run: |
          set +e
          
          echo "========================================="
          echo "Starting Find & Replace Operations"
          echo "========================================="
          
          OPERATION_NUM=0
          TOTAL_REPLACED=0
          
          while IFS='|' read -r SEARCH_PATH FIND_TEXT REPLACE_TEXT; do
            [[ -z "$SEARCH_PATH" ]] && continue

            ((OPERATION_NUM++))
            echo ""
            echo "--- Operation #$OPERATION_NUM ---"
            echo "Path: $SEARCH_PATH"
            echo "Find: $FIND_TEXT"
            echo "Replace: $REPLACE_TEXT"

            if [ ! -e "$SEARCH_PATH" ]; then
              echo "⚠ Warning: Path '$SEARCH_PATH' does not exist"
              continue
            fi

            if [ -f "$SEARCH_PATH" ]; then
              if grep -q "$FIND_TEXT" "$SEARCH_PATH"; then
                sed -i "s|$FIND_TEXT|$REPLACE_TEXT|g" "$SEARCH_PATH"
                echo "✓ Replaced in: $SEARCH_PATH"
                ((TOTAL_REPLACED++))
              else
                echo "⊘ Text not found in: $SEARCH_PATH"
              fi
            elif [ -d "$SEARCH_PATH" ]; then
              FILES_FOUND=$(find "$SEARCH_PATH" -type f \
                ! -path "*/.*" \
                ! -path "*/build/*" \
                ! -path "*/.dart_tool/*" \
                ! -path "*/node_modules/*" \
                ! -name "*.apk" \
                ! -name "*.aab" \
                ! -name "*.so" \
                ! -name "*.jar" \
                2>/dev/null)

              if [ -z "$FILES_FOUND" ]; then
                echo "⊘ No files found in directory"
              else
                REPLACED_COUNT=0
                while IFS= read -r file; do
                  if grep -q "$FIND_TEXT" "$file" 2>/dev/null; then
                    sed -i "s|$FIND_TEXT|$REPLACE_TEXT|g" "$file"
                    echo "✓ Replaced in: $file"
                    ((REPLACED_COUNT++))
                    ((TOTAL_REPLACED++))
                  fi
                done <<< "$FILES_FOUND"

                [ $REPLACED_COUNT -eq 0 ] && echo "⊘ Text not found in any files"
              fi
            fi
          done <<< "${{ inputs.find-replace-list }}"
          
          echo ""
          echo "========================================="
          echo "Total operations: $OPERATION_NUM"
          echo "Total files modified: $TOTAL_REPLACED"
          echo "========================================="
          
          set -e

      - name: Configure Git for Dependencies
        env:
          AUTH_TOKEN: ${{ secrets.PAT_TOKEN || github.token }}
        run: |
          # Clean any lingering extraheader credentials
          git config --global --unset-all http.https://github.com/.extraheader 2>/dev/null || true
          git config --local --unset-all http.https://github.com/.extraheader 2>/dev/null || true

          # Clean stale git cache on self-hosted runners to prevent corrupted ref listing
          rm -rf "${PUB_CACHE:-$HOME/.pub-cache}/git" "$HOME/.pub-cache/git" 2>/dev/null || true

          # Authenticate Git with token (PAT or GITHUB_TOKEN) to ensure authenticated downloads
          if [ -n "$AUTH_TOKEN" ]; then
            echo "✓ Configuring Git authentication with token"
            git config --global url."https://${AUTH_TOKEN}@github.com/".insteadOf "https://github.com/"
            
            # Configure .netrc for standard Git credentials
            printf "machine github.com\n  login oauth2\n  password %s\n\nmachine api.github.com\n  login oauth2\n  password %s\n" \
              "${AUTH_TOKEN}" "${AUTH_TOKEN}" >> ~/.netrc
            chmod 600 ~/.netrc
          fi

      - name: Get dependencies
        env:
          GIT_TERMINAL_PROMPT: 0
        run: flutter pub upgrade

      - name: Run build_runner (if available)
        run: |
          if grep -q "build_runner:" pubspec.yaml; then
            echo "Running build_runner..."
            flutter pub run build_runner build --delete-conflicting-outputs
          else
            echo "build_runner not found, skipping..."
          fi

      - name: Run Tests
        if: ${{ inputs.run-tests }}
        shell: bash
        run: |
          # 1. Check commit message for test skip flag
          commit_msg=$(git log -1 --pretty=%B 2>/dev/null || true)
          if echo "$commit_msg" | grep -qiE "\[(skip|no)[- _]?(tests?|ci)\]"; then
            echo "⏩ Skipping tests: commit message contains skip instruction."
            exit 0
          fi

          # 2. Check if flutter_test is configured in pubspec.yaml
          if [ -f "pubspec.yaml" ] && ! grep -q "flutter_test" pubspec.yaml; then
            echo "ℹ️ 'flutter_test' dependency not found in pubspec.yaml. Skipping tests."
            exit 0
          fi

          # 3. Check if test directory exists and contains test files
          if [ ! -d "test" ] || [ -z "$(find test -name '*_test.dart' -print -quit 2>/dev/null)" ]; then
            echo "ℹ️ No test files found in test/ directory. Skipping tests."
            exit 0
          fi

          echo "🧪 Tests found and flutter_test configured. Running 'flutter test'..."
          flutter test

      - name: Build APK
        run: flutter build apk --release

      - name: Build App Bundle
        run: |
          if [[ "${{ inputs.enable-obfuscation }}" == "true" ]]; then
            flutter build appbundle --release \
              --obfuscate \
              --split-debug-info=build/app/outputs/symbols
          else
            flutter build appbundle --release
          fi

      - name: Prepare Release Files
        run: |
          mkdir -p release-files
          
          PACKAGE_NAME="${{ steps.detect-bundle.outputs.bundle-id }}"
          
          cp build/app/outputs/flutter-apk/app-release.apk "release-files/${PACKAGE_NAME}-release.apk"
          cp build/app/outputs/bundle/release/app-release.aab "release-files/${PACKAGE_NAME}-release.aab"
          
          if [[ "${{ inputs.enable-obfuscation }}" == "true" ]]; then
            MAPPING_FILE=$(find build android -name "mapping.txt" -type f 2>/dev/null | head -n 1)
            if [ -n "$MAPPING_FILE" ] && [ -f "$MAPPING_FILE" ]; then
              cp "$MAPPING_FILE" "release-files/${PACKAGE_NAME}-mapping.txt"
              echo "✓ Mapping file copied"
            else
              echo "⚠ Warning: mapping.txt not found"
            fi

            if [ -d "build/app/outputs/symbols" ]; then
              TARGET_ZIP="$(pwd)/release-files/${PACKAGE_NAME}-symbols.zip"
              (cd build/app/outputs && zip -r "$TARGET_ZIP" symbols)
              echo "✓ Debug symbols zipped to release-files/${PACKAGE_NAME}-symbols.zip"
            else
              echo "⚠ Warning: symbols directory not found"
            fi
          fi
          
          echo ""
          echo "=== Release Files ==="
          ls -lh release-files/

      - name: Upload Debug Symbols to Firebase Crashlytics
        if: ${{ inputs.enable-obfuscation == true }}
        continue-on-error: true
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: |
          if [ ! -d "build/app/outputs/symbols" ]; then
            echo "ℹ No symbols directory found at build/app/outputs/symbols. Skipping Crashlytics upload."
            exit 0
          fi

          APP_ID=""
          if [ -f "firebase.json" ] && command -v jq &>/dev/null; then
            APP_ID=$(jq -r '.flutter.platforms.android.default.appId // empty' firebase.json 2>/dev/null || true)
          fi

          if [ -z "$APP_ID" ] && [ -f "android/app/google-services.json" ] && command -v jq &>/dev/null; then
            APP_ID=$(jq -r '.client[0].client_info.mobilesdk_app_id // empty' android/app/google-services.json 2>/dev/null || true)
          fi

          if [ -z "$APP_ID" ]; then
            echo "⚠ Could not detect Firebase Android App ID. Skipping Crashlytics symbols upload."
            exit 0
          fi

          echo "Found Firebase Android App ID: $APP_ID"

          if [ -n "$FIREBASE_SERVICE_ACCOUNT" ]; then
            echo "$FIREBASE_SERVICE_ACCOUNT" > "$HOME/firebase_service_account.json"
            export GOOGLE_APPLICATION_CREDENTIALS="$HOME/firebase_service_account.json"
          fi

          if ! command -v firebase &>/dev/null; then
            npm install -g firebase-tools
          fi

          echo "🚀 Uploading symbols to Firebase Crashlytics..."
          firebase crashlytics:symbols:upload --app="$APP_ID" build/app/outputs/symbols || {
            echo "⚠ Symbol upload encountered an issue, continuing build..."
          }

      # ─────────────────────────────────────────────
      #  📊 APK Analysis Step
      # ─────────────────────────────────────────────
      - name: Analyze APK
        id: apk-analysis
        run: |
          set +e
          PACKAGE_NAME="${{ steps.detect-bundle.outputs.bundle-id }}"
          APK_PATH="release-files/${PACKAGE_NAME}-release.apk"
          AAB_PATH="release-files/${PACKAGE_NAME}-release.aab"

          # ── helper: bytes → MB بدون bc ──────────────
          bytes_to_mb() {
            awk "BEGIN { printf \"%.2f\", $1/1048576 }"
          }

          # ── حجم الملفات ──────────────────────────
          APK_BYTES=$(stat -c%s "$APK_PATH" 2>/dev/null || echo 0)
          AAB_BYTES=$(stat -c%s "$AAB_PATH" 2>/dev/null || echo 0)
          APK_MB=$(bytes_to_mb $APK_BYTES)
          AAB_MB=$(bytes_to_mb $AAB_BYTES)

          echo "📦 APK size: ${APK_MB} MB"
          echo "📦 AAB size: ${AAB_MB} MB"

          # ── فك الضغط ─────────────────────────────
          WORK_DIR=$(mktemp -d)
          unzip -q "$APK_PATH" -d "$WORK_DIR" 2>/dev/null

          # ── حجم كل مجلد رئيسي ────────────────────
          echo ""
          echo "=== APK Internal Size Breakdown ==="

          # نحتفظ بالأحجام في متغيرات منفصلة (بدل declare -A عشان الـ scope)
          LIB_MB=0; ASSETS_MB_DIR=0; RES_MB=0

          for dir in lib assets res kotlin META-INF; do
            if [ -d "$WORK_DIR/$dir" ]; then
              SIZE=$(du -sb "$WORK_DIR/$dir" 2>/dev/null | cut -f1)
              SIZE_MB=$(bytes_to_mb ${SIZE:-0})
              echo "  /$dir → ${SIZE_MB} MB"
              case $dir in
                lib)    LIB_MB=$SIZE_MB ;;
                assets) ASSETS_MB_DIR=$SIZE_MB ;;
                res)    RES_MB=$SIZE_MB ;;
              esac
            fi
          done

          # ── حجم classes.dex ───────────────────────
          DEX_TOTAL=0
          DEX_COUNT=0
          for dex in "$WORK_DIR"/classes*.dex; do
            [ -f "$dex" ] && {
              S=$(stat -c%s "$dex")
              DEX_TOTAL=$((DEX_TOTAL + S))
              DEX_COUNT=$((DEX_COUNT + 1))
            }
          done
          DEX_MB=$(bytes_to_mb $DEX_TOTAL)
          echo "  /classes.dex (×${DEX_COUNT}) → ${DEX_MB} MB"

          # ── Top 10 أكبر ملفات في الـ APK ────────
          echo ""
          echo "=== Top 10 Largest Files in APK ==="
          # نجمع كل الملفات في ملف مؤقت لتفادي Broken pipe
          TMP_SIZES=$(mktemp)
          find "$WORK_DIR" -type f -exec stat -c "%s %n" {} \; 2>/dev/null > "$TMP_SIZES"
          sort -rn "$TMP_SIZES" | head -10 | while read SIZE FPATH; do
            REL="${FPATH#$WORK_DIR/}"
            MB=$(bytes_to_mb $SIZE)
            echo "  ${MB} MB  →  ${REL}"
          done
          rm -f "$TMP_SIZES"

          # ── Native Libraries (.so) ────────────────
          echo ""
          echo "=== Native Libraries ==="
          SO_COUNT=0
          SO_ARCHES="none"
          if [ -d "$WORK_DIR/lib" ]; then
            TMP_SO=$(mktemp)
            find "$WORK_DIR/lib" -name "*.so" -exec stat -c "%s %n" {} \; 2>/dev/null > "$TMP_SO"
            sort -rn "$TMP_SO" | head -10 | while read SIZE FPATH; do
              REL="${FPATH#$WORK_DIR/lib/}"
              MB=$(bytes_to_mb $SIZE)
              echo "  ${MB} MB  →  ${REL}"
            done
            rm -f "$TMP_SO"
            SO_COUNT=$(find "$WORK_DIR/lib" -name "*.so" 2>/dev/null | wc -l)
            SO_ARCHES=$(ls "$WORK_DIR/lib/" 2>/dev/null | tr '\n' ',' | sed 's/,$//')
            echo "  Total .so files: $SO_COUNT | Architectures: $SO_ARCHES"
          else
            echo "  No native libraries found"
          fi

          # ── Assets Breakdown ──────────────────────
          echo ""
          echo "=== Assets Breakdown ==="
          ASSETS_TOTAL=0
          if [ -d "$WORK_DIR/assets" ]; then
            ASSETS_TOTAL=$(du -sb "$WORK_DIR/assets" 2>/dev/null | cut -f1)
            find "$WORK_DIR/assets" -type f 2>/dev/null \
              | sed "s|$WORK_DIR/assets/||" \
              | awk -F'/' '{print $1}' \
              | sort | uniq -c | sort -rn | head -10 \
              | while read COUNT DIR; do
                  echo "  ${COUNT} files  →  assets/${DIR}"
                done
          fi
          ASSETS_MB=$(bytes_to_mb ${ASSETS_TOTAL:-0})

          # ── Permissions ───────────────────────────
          echo ""
          echo "=== Declared Permissions ==="
          PERM_COUNT=0
          if command -v aapt &>/dev/null; then
            PERMS=$(aapt dump permissions "$APK_PATH" 2>/dev/null \
              | grep "uses-permission" \
              | sed "s/.*name='//" | sed "s/'.*$//" \
              | sort)
            PERM_COUNT=$(echo "$PERMS" | grep -c . 2>/dev/null || echo 0)
            echo "$PERMS" | head -20 | while read -r p; do echo "  • $p"; done
            echo "  Total permissions: $PERM_COUNT"
          else
            # fallback بدون aapt — نعدّ من binary الـ manifest
            PERM_COUNT=$(strings "$WORK_DIR/AndroidManifest.xml" 2>/dev/null \
              | grep -c "android.permission" || echo 0)
            echo "  (aapt not available — estimated permission count: $PERM_COUNT)"
          fi

          # ── تنظيف ─────────────────────────────────
          rm -rf "$WORK_DIR"

          # ── حفظ المتغيرات للـ release notes ────────
          {
            echo "APK_MB=${APK_MB}"
            echo "AAB_MB=${AAB_MB}"
            echo "DEX_MB=${DEX_MB}"
            echo "DEX_COUNT=${DEX_COUNT}"
            echo "ASSETS_MB=${ASSETS_MB}"
            echo "SO_COUNT=${SO_COUNT}"
            echo "SO_ARCHES=${SO_ARCHES}"
            echo "LIB_MB=${LIB_MB}"
            echo "RES_MB=${RES_MB}"
            echo "PERM_COUNT=${PERM_COUNT}"
          } >> $GITHUB_OUTPUT

          set -e

      - name: Upload APK to Artifacts
        if: ${{ !startsWith(github.ref, 'refs/tags/') }}
        uses: actions/upload-artifact@v7
        with:
          name: ${{ steps.detect-bundle.outputs.bundle-id }}-apk
          path: release-files/*-release.apk
          if-no-files-found: warn
          retention-days: 30

      - name: Upload AAB to Artifacts
        if: ${{ !startsWith(github.ref, 'refs/tags/') }}
        uses: actions/upload-artifact@v7
        with:
          name: ${{ steps.detect-bundle.outputs.bundle-id }}-aab
          path: release-files/*-release.aab
          if-no-files-found: warn
          retention-days: 30

      - name: Upload Mapping File to Artifacts
        if: ${{ !startsWith(github.ref, 'refs/tags/') && inputs.enable-obfuscation == true }}
        uses: actions/upload-artifact@v7
        with:
          name: ${{ steps.detect-bundle.outputs.bundle-id }}-mapping
          path: release-files/*-mapping.txt
          if-no-files-found: warn
          retention-days: 30

      - name: Upload Symbols to Artifacts
        if: ${{ !startsWith(github.ref, 'refs/tags/') && inputs.enable-obfuscation == true }}
        uses: actions/upload-artifact@v7
        with:
          name: ${{ steps.detect-bundle.outputs.bundle-id }}-symbols
          path: release-files/*-symbols.zip
          if-no-files-found: warn
          retention-days: 30

      - name: Release to GitHub
        uses: softprops/action-gh-release@v3
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: |
            release-files/*-release.apk
            release-files/*-release.aab
            release-files/*-mapping.txt
            release-files/*-symbols.zip
          body: |
            ## 📦 Release Build

            ### Files:
            - **APK**: Direct installation file
            - **AAB**: Google Play bundle${{ inputs.enable-obfuscation == true && ' (obfuscated)' || '' }}
            ${{ inputs.enable-obfuscation == true && '- **mapping.txt**: ProGuard mapping for crash reports' || '' }}
            ${{ inputs.enable-obfuscation == true && '- **symbols.zip**: Dart debug symbols for stack trace deobfuscation' || '' }}

            ---

            ## 📊 APK Analysis

            ### 📏 File Sizes
            | File | Size |
            |------|------|
            | APK  | ${{ steps.apk-analysis.outputs.APK_MB }} MB |
            | AAB  | ${{ steps.apk-analysis.outputs.AAB_MB }} MB |

            ### 🧩 APK Internal Breakdown
            | Section | Size |
            |---------|------|
            | Dart Code (DEX ×${{ steps.apk-analysis.outputs.DEX_COUNT }}) | ${{ steps.apk-analysis.outputs.DEX_MB }} MB |
            | Native Libraries (.so) | ${{ steps.apk-analysis.outputs.LIB_MB }} MB |
            | Resources | ${{ steps.apk-analysis.outputs.RES_MB }} MB |
            | Assets | ${{ steps.apk-analysis.outputs.ASSETS_MB }} MB |

            ### 📱 Native Libraries
            - **Count**: ${{ steps.apk-analysis.outputs.SO_COUNT }} files
            - **Architectures**: `${{ steps.apk-analysis.outputs.SO_ARCHES }}`

            ### 🔐 Permissions
            - **Total declared**: ${{ steps.apk-analysis.outputs.PERM_COUNT }}

            ---

            ### 🛠 Build Info
            | Property | Value |
            |----------|-------|
            | Flutter  | ${{ steps.fvm-config-action.outputs.FLUTTER_VERSION }} |
            | Channel  | ${{ steps.fvm-config-action.outputs.FLUTTER_CHANNEL }} |
            | Java     | ${{ inputs.java-version }} |
            | Obfuscation | ${{ inputs.enable-obfuscation }} |
            | App Name | ${{ inputs.app-name || 'Default' }} |
            | Bundle ID | ${{ steps.detect-bundle.outputs.bundle-id }} |
            | Icon Updated | ${{ inputs.icon-url != '' }} |
            | Commit   | ${{ github.sha }} |
          fail_on_unmatched_files: false
