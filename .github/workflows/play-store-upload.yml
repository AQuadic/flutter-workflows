name: Upload to Google Play

on:
  workflow_call:
    inputs:
      use_latest:
        description: 'Use latest release if not triggered by tag?'
        required: false
        type: boolean
        default: false
      release_tag:
        description: 'Specific release tag (e.g., v1.0.0)'
        required: false
        type: string
      play_store_track:
        description: 'Play Store track (internal/alpha/beta/production)'
        required: false
        type: string
        default: 'internal'
      runner-type:
        description: 'Runner type to use'
        required: false
        type: string
        default: 'self-hosted'
    secrets:
      PLAY_STORE_SERVICE_ACCOUNT:
        required: true

jobs:
  # ─── Job 1: Discover all AAB files ────────────────────────────────────────
  discover-aabs:
    runs-on: ${{ inputs.runner-type || vars.RUNNER_TYPE || 'self-hosted' }}
    outputs:
      tag:     ${{ steps.build-matrix.outputs.tag }}
      indices: ${{ steps.build-matrix.outputs.indices }}

    steps:
      - name: Discover AABs and save matrix
        id: build-matrix
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          TAG=""
          # ── Resolve release tag ────────────────────────────────────────────
          if [ "${{ github.event_name }}" == "release" ]; then
            TAG="${{ github.event.release.tag_name }}"
          elif [ -n "${{ inputs.release_tag }}" ]; then
            TAG="${{ inputs.release_tag }}"
          elif [[ "${{ github.ref }}" == refs/tags/* ]]; then
            TAG="${{ github.ref_name }}"
          elif [ "${{ inputs.use_latest }}" == "true" ]; then
            TAG=$(curl -sL \
              -H "Authorization: Bearer ${GITHUB_TOKEN}" \
              -H "Accept: application/vnd.github+json" \
              "https://api.github.com/repos/${{ github.repository }}/releases/latest" \
              | jq -r '.tag_name // empty')
          fi

          if [ -z "$TAG" ] || [ "$TAG" == "null" ]; then
            echo "ℹ️ No release tag detected for this run. Skipping Play Store upload."
            echo "tag=" >> $GITHUB_OUTPUT
            echo "indices=[]" >> $GITHUB_OUTPUT
            mkdir -p ./matrix
            echo "[]" > ./matrix/aab-matrix.json
            exit 0
          fi

          echo "tag=${TAG}" >> $GITHUB_OUTPUT
          echo "✓ Release: ${TAG}"

          # ── Fetch assets and build matrix ──────────────────────────────────
          RELEASE_DATA=$(curl -sL \
            -H "Authorization: Bearer ${GITHUB_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${{ github.repository }}/releases/tags/${TAG}")

          MATRIX=$(echo "$RELEASE_DATA" | jq -c '
            . as $release |
            [
              (.assets // [])[] | select(.name | endswith(".aab")) | . as $aab |
              {
                name:         $aab.name,
                package_name: ($aab.name | gsub("-release\\.aab$"; "")),
                asset_id:     ($aab.id | tostring),
                mapping_id: (
                  ($aab.name | gsub("-release\\.aab$"; "") | gsub("\\.aab$"; "")) as $prefix |
                  ($release.assets[] | select(
                    .name == ($prefix + "-mapping.txt") or
                    .name == ($prefix + "_mapping.txt") or
                    .name == ($aab.name | gsub("\\.aab$"; "") + "-mapping.txt")
                  ) | .id | tostring) // ""
                ),
                symbols_id: (
                  ($aab.name | gsub("-release\\.aab$"; "") | gsub("\\.aab$"; "")) as $prefix |
                  ($release.assets[] | select(
                    .name == ($prefix + "-symbols.zip") or
                    .name == ($prefix + "_symbols.zip") or
                    .name == ($aab.name | gsub("\\.aab$"; "") + "-symbols.zip")
                  ) | .id | tostring) // ""
                )
              }
            ]
          ' 2>/dev/null || echo "[]")

          COUNT=$(echo "$MATRIX" | jq 'length' 2>/dev/null || echo 0)
          if [ "$COUNT" -eq 0 ]; then
            echo "ℹ️ No .aab files found in release ${TAG}. Skipping Play Store upload."
            echo "indices=[]" >> $GITHUB_OUTPUT
            mkdir -p ./matrix
            echo "[]" > ./matrix/aab-matrix.json
            exit 0
          fi

          echo "✅ Found ${COUNT} AAB file(s):"
          echo "$MATRIX" | jq -r '.[] | "\(.package_name)  ←  \(.name)"'

          # Output: just indices [0,1,2,...] — plain numbers, won't be masked
          INDICES=$(jq -cn --argjson n "$COUNT" '[range($n)]')
          echo "indices=${INDICES}" >> $GITHUB_OUTPUT

          # Save full matrix to artifact
          mkdir -p ./matrix
          echo "$MATRIX" > ./matrix/aab-matrix.json

      - name: Upload matrix artifact
        if: steps.build-matrix.outputs.indices != '[]' && steps.build-matrix.outputs.indices != ''
        uses: actions/upload-artifact@v7
        with:
          name: aab-matrix
          path: ./matrix/aab-matrix.json
          retention-days: 1

  # ─── Job 2: Upload each AAB independently ─────────────────────────────────
  upload-to-play-store:
    needs: discover-aabs
    if: needs.discover-aabs.outputs.indices != '' && needs.discover-aabs.outputs.indices != '[]'
    runs-on: ${{ inputs.runner-type || vars.RUNNER_TYPE || 'self-hosted' }}
    strategy:
      fail-fast: false
      matrix:
        index: ${{ fromJson(needs.discover-aabs.outputs.indices) }}
    name: Upload AAB [${{ matrix.index }}]

    steps:
      - name: Download matrix artifact
        uses: actions/download-artifact@v8
        with:
          name: aab-matrix
          path: ./matrix

      - name: Read AAB info
        id: aab
        run: |
          ENTRY=$(jq -c '.[${{ matrix.index }}]' ./matrix/aab-matrix.json)
          echo "name=$(echo $ENTRY         | jq -r '.name')"         >> $GITHUB_OUTPUT
          echo "package_name=$(echo $ENTRY | jq -r '.package_name')" >> $GITHUB_OUTPUT
          echo "asset_id=$(echo $ENTRY     | jq -r '.asset_id')"     >> $GITHUB_OUTPUT
          echo "mapping_id=$(echo $ENTRY   | jq -r '.mapping_id')"   >> $GITHUB_OUTPUT
          echo "symbols_id=$(echo $ENTRY   | jq -r '.symbols_id')"   >> $GITHUB_OUTPUT

      - name: Download AAB, mapping and symbols
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          REPO="${{ github.repository }}"
          mkdir -p ./download

          curl -sL \
            -H "Authorization: Bearer ${GITHUB_TOKEN}" \
            -H "Accept: application/octet-stream" \
            -o "./download/${{ steps.aab.outputs.name }}" \
            "https://api.github.com/repos/${REPO}/releases/assets/${{ steps.aab.outputs.asset_id }}"

          unzip -t "./download/${{ steps.aab.outputs.name }}" > /dev/null 2>&1 \
            || { echo "❌ AAB is corrupted!"; exit 1; }
          echo "✓ Downloaded ${{ steps.aab.outputs.name }}"

          if [ -n "${{ steps.aab.outputs.mapping_id }}" ]; then
            curl -sL \
              -H "Authorization: Bearer ${GITHUB_TOKEN}" \
              -H "Accept: application/octet-stream" \
              -o ./download/mapping.txt \
              "https://api.github.com/repos/${REPO}/releases/assets/${{ steps.aab.outputs.mapping_id }}"

            MAPPING_SIZE=$(stat -c%s ./download/mapping.txt 2>/dev/null || stat -f%z ./download/mapping.txt)
            if [ "$MAPPING_SIZE" -gt 5242880 ]; then
              echo "::warning::mapping.txt is ${MAPPING_SIZE} bytes (> 5MB limit of Google Play Developer API). Removing mapping.txt to prevent upload failure. Note: AAB already embeds proguard.map in BUNDLE-METADATA. To reduce mapping size, switch from proguard-android-optimize.txt to proguard-android.txt in build.gradle."
              rm -f ./download/mapping.txt
            else
              echo "✓ Downloaded mapping.txt (${MAPPING_SIZE} bytes - within Play Store API 5MB limit)"
            fi
          fi

          # Fail if neither AAB was found or corrupted
          if [ ! -f "./download/${{ steps.aab.outputs.name }}" ]; then
            echo "❌ AAB file missing!"
            exit 1
          fi

      - name: Resolve upload params
        id: params
        run: |
          [ -d "whatsnew" ]              && echo "whatsnew_dir=./whatsnew/"            >> $GITHUB_OUTPUT || echo "whatsnew_dir=" >> $GITHUB_OUTPUT
          [ -f "./download/mapping.txt" ] && echo "mapping_file=./download/mapping.txt" >> $GITHUB_OUTPUT || echo "mapping_file=" >> $GITHUB_OUTPUT

      - name: Upload to Play Store (completed)
        id: upload
        continue-on-error: true
        uses: r0adkll/upload-google-play@v1
        with:
          serviceAccountJsonPlainText: ${{ secrets.PLAY_STORE_SERVICE_ACCOUNT }}
          packageName: ${{ steps.aab.outputs.package_name }}
          releaseFiles: ./download/${{ steps.aab.outputs.name }}
          track: ${{ inputs.play_store_track || vars.PLAY_STORE_TRACK || 'internal' }}
          status: completed
          # whatsNewDirectory: ${{ steps.params.outputs.whatsnew_dir }}
          mappingFile: ${{ steps.params.outputs.mapping_file }}

      - name: Upload to Play Store (draft fallback)
        if: steps.upload.outcome == 'failure'
        uses: r0adkll/upload-google-play@v1
        with:
          serviceAccountJsonPlainText: ${{ secrets.PLAY_STORE_SERVICE_ACCOUNT }}
          packageName: ${{ steps.aab.outputs.package_name }}
          releaseFiles: ./download/${{ steps.aab.outputs.name }}
          track: ${{ inputs.play_store_track || vars.PLAY_STORE_TRACK || 'internal' }}
          status: draft
          # whatsNewDirectory: ${{ steps.params.outputs.whatsnew_dir }}
          mappingFile: ${{ steps.params.outputs.mapping_file }}

      - name: Summary
        if: always()
        run: |
          echo "📦 ${{ steps.aab.outputs.package_name }} | 🎯 ${{ inputs.play_store_track || vars.PLAY_STORE_TRACK || 'internal' }} | 🏷️ ${{ needs.discover-aabs.outputs.tag }}"
          if [ "${{ job.status }}" = "success" ]; then
            echo "✅ Upload succeeded"
          else
            echo "❌ Upload FAILED"
          fi
