name: Flutter iOS Build

on:
  workflow_call:
    inputs:
      app-name:
        description: 'New App Name to rename (optional)'
        required: false
        type: string
      bundle-id:
        description: 'New iOS Bundle ID (optional)'
        required: false
        type: string
      find-replace-list:
        description: |
          Multiple find & replace operations (one per line)
          Format: path|find_text|replace_text
          Example:
            lib/config|old_url|new_url
            lib/main.dart|OldApp|NewApp
        required: false
        type: string
      firebase-project-id:
        description: 'Firebase Project ID for configuration'
        required: false
        type: string
      icon-url:
        description: 'URL to download the app icon (png)'
        required: false
        type: string
      pre-build-script:
        description: 'Script to run before the build process (e.g. "./scripts/prepare.sh")'
        required: false
        type: string
      run-tests:
        description: 'Run unit tests before building if tests exist'
        required: false
        type: boolean
        default: true
      certificates-repo:
        description: 'GitHub repository path for iOS certificates (e.g. your-org/ios-certificates). Defaults to vars.CERTIFICATES_REPO or <owner>/ios-certificates'
        required: false
        type: string
        default: ''
      runner-type:
        description: 'Runner type to use'
        required: false
        type: string
        default: 'macos-latest'

    secrets:
      APPSTORE_ACCOUNT_ID:
        description: 'Branch name in certificates repo (e.g. your-app-account)'
        required: true
      CERTIFICATES_REPO_TOKEN:
        description: 'PAT with read access to certificates repo'
        required: true
      FIREBASE_SERVICE_ACCOUNT:
        description: 'Firebase Service Account JSON (optional)'
        required: false
      PAT_TOKEN:
        description: 'Personal Access Token for private Git dependencies (optional)'
        required: false

jobs:
  ios-build:
    runs-on: ${{ inputs.runner-type || 'macos-latest' }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Select Latest Xcode
        run: |
          LATEST_XCODE=$(ls -d /Applications/Xcode*.app | sort -V | tail -n 1)
          echo "Using Xcode at: $LATEST_XCODE"
          sudo xcode-select -switch "$LATEST_XCODE"
          xcodebuild -version

      - name: Authenticate Git and Configure Xcode SPM
        env:
          AUTH_TOKEN: ${{ secrets.PAT_TOKEN || github.token }}
        run: |
          # Clean any lingering extraheader credentials (critical for public git dependencies)
          git config --global --unset-all http.https://github.com/.extraheader 2>/dev/null || true
          git config --local --unset-all http.https://github.com/.extraheader 2>/dev/null || true

          # Clean stale git cache on self-hosted/local runners
          rm -rf "${PUB_CACHE:-$HOME/.pub-cache}/git" "$HOME/.pub-cache/git" 2>/dev/null || true

          # Authenticate with token
          if [ -n "$AUTH_TOKEN" ]; then
            git config --global url."https://${AUTH_TOKEN}@github.com/".insteadOf "https://github.com/"
            echo "✓ Git authenticated with token"
          fi
          
          # Increase Git buffers and network throughput
          git config --global http.postBuffer 524288000
          git config --global http.maxRequestBuffer 100M
          git config --global core.compression 0

          # Enable shallow clones in Xcode for Swift Packages
          defaults write com.apple.dt.Xcode IDEPackageSupportUseBuiltinSCM YES

          # Fix: prevent xcodebuild from opening Keychain dialog during SPM resolve
          # (see: https://github.com/actions/runner-images/issues/10722)
          # Force xcodebuild to use .netrc for package auth instead of Keychain
          if [ -n "${AUTH_TOKEN}" ]; then
            printf "machine github.com\n  login oauth2\n  password %s\n\nmachine api.github.com\n  login oauth2\n  password %s\n" \
              "${AUTH_TOKEN}" "${AUTH_TOKEN}" >> ~/.netrc
            chmod 600 ~/.netrc
          fi
          
          echo "✓ Git and Xcode SPM configured & optimized"

      - name: Configure FVM
        uses: kuhnroyal/flutter-fvm-config-action/config@v3
        id: fvm-config-action

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ steps.fvm-config-action.outputs.FLUTTER_VERSION }}
          channel: ${{ steps.fvm-config-action.outputs.FLUTTER_CHANNEL }}
          cache: true

      - name: Flutter version
        run: flutter --version

      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.2'
          bundler-cache: false

      - name: Install Fastlane
        run: which fastlane || gem install fastlane

      # ── Read account config from certificates repo ─────────────────────────
      - name: Read account config
        id: config
        env:
          CERTIFICATES_REPO_INPUT: ${{ inputs.certificates-repo }}
          CERTIFICATES_REPO_VAR: ${{ vars.CERTIFICATES_REPO }}
          DEFAULT_REPO: ${{ github.repository_owner }}/ios-certificates
          CERTIFICATES_REPO_TOKEN: ${{ secrets.CERTIFICATES_REPO_TOKEN }}
          APPSTORE_ACCOUNT_ID: ${{ secrets.APPSTORE_ACCOUNT_ID }}
        run: |
          REPO_NAME="${CERTIFICATES_REPO_INPUT:-${CERTIFICATES_REPO_VAR:-$DEFAULT_REPO}}"
          echo "repo_name=${REPO_NAME}" >> $GITHUB_OUTPUT
          echo "🔍 Fetching config.json from ${REPO_NAME} for branch: ${APPSTORE_ACCOUNT_ID}..."
          if [ -z "${CERTIFICATES_REPO_TOKEN}" ]; then
            echo "❌ CERTIFICATES_REPO_TOKEN secret is empty!"
            exit 1
          fi
          if [ -z "${APPSTORE_ACCOUNT_ID}" ]; then
            echo "❌ APPSTORE_ACCOUNT_ID secret is empty!"
            exit 1
          fi

          HTTP_CODE=$(curl -s -o /tmp/raw_config.json -w "%{http_code}" \
            -H "Authorization: Bearer ${CERTIFICATES_REPO_TOKEN}" \
            -H "Accept: application/vnd.github.raw" \
            "https://api.github.com/repos/${REPO_NAME}/contents/config.json?ref=${APPSTORE_ACCOUNT_ID}")

          echo "HTTP Response Code: $HTTP_CODE"
          if [ "$HTTP_CODE" != "200" ]; then
            echo "❌ Failed to fetch config.json from ${REPO_NAME} (HTTP $HTTP_CODE)"
            cat /tmp/raw_config.json
            exit 1
          fi

          CONFIG=$(cat /tmp/raw_config.json)
          ISSUER_ID=$(echo "$CONFIG" | jq -r '.issuer_id // empty')
          KEY_ID=$(echo "$CONFIG" | jq -r '.key_id // empty')
          MATCH_PASSWORD=$(echo "$CONFIG" | jq -r '.match_password // empty')
          TEAM_ID=$(echo "$CONFIG" | jq -r '.team_id // empty')

          echo "issuer_id=$ISSUER_ID" >> $GITHUB_OUTPUT
          echo "key_id=$KEY_ID" >> $GITHUB_OUTPUT
          echo "match_password=$MATCH_PASSWORD" >> $GITHUB_OUTPUT
          echo "team_id=$TEAM_ID" >> $GITHUB_OUTPUT

          echo "$CONFIG" | jq -r '.key_content' > /tmp/api_key.p8

          echo "✅ Config loaded:"
          echo "  - Team ID: $TEAM_ID"
          echo "  - Key ID: $KEY_ID"
          echo "  - Issuer ID: $ISSUER_ID"
          echo "  - Match password length: ${#MATCH_PASSWORD}"
          echo "  - API Key file size: $(wc -c < /tmp/api_key.p8) bytes"

      - name: Write App Store Connect API Key
        run: |
          cat > /tmp/api_key.json <<EOF
          {
            "key_id": "${{ steps.config.outputs.key_id }}",
            "issuer_id": "${{ steps.config.outputs.issuer_id }}",
            "key_filepath": "/tmp/api_key.p8",
            "duration": 1200,
            "in_house": false
          }
          EOF
          echo "✓ /tmp/api_key.json written"

      # ── Change Bundle ID (before detection) ───────────────────────────────
      - name: Change iOS Bundle ID
        if: ${{ inputs.bundle-id != '' }}
        run: |
          /usr/libexec/PlistBuddy -c \
            "Set :CFBundleIdentifier ${{ inputs.bundle-id }}" \
            ios/Runner/Info.plist
          echo "✓ Bundle ID changed to ${{ inputs.bundle-id }}"

      # ── Detect Bundle ID ───────────────────────────────────────────────────
      - name: Detect Bundle ID
        id: detect-bundle
        run: |
          if [ -n "${{ inputs.bundle-id }}" ]; then
            BUNDLE_ID="${{ inputs.bundle-id }}"
            echo "✓ Using provided bundle-id: $BUNDLE_ID"
          else
            echo "🔍 Detecting bundle ID from project.pbxproj..."
            # 1. Read directly from project.pbxproj
            BUNDLE_ID=$(grep -E 'PRODUCT_BUNDLE_IDENTIFIER = [a-zA-Z0-9\.]+' ios/Runner.xcodeproj/project.pbxproj 2>/dev/null \
              | grep -v 'RunnerTests' \
              | head -n 1 \
              | sed 's/.*= //;s/;//;s/ //g' \
              | tr -d '[:space:]')

            # 2. Fallback: xcodebuild
            if [ -z "$BUNDLE_ID" ]; then
              BUNDLE_ID=$(cd ios && xcodebuild -showBuildSettings \
                -scheme Runner \
                -workspace Runner.xcworkspace \
                2>/dev/null \
                | grep -w 'PRODUCT_BUNDLE_IDENTIFIER' \
                | grep -v 'DERIVE_MACCATALYST' \
                | awk -F' = ' '{print $2}' \
                | tr -d '[:space:]' \
                | head -n 1)
            fi

            # 3. Fallback: Info.plist
            if [ -z "$BUNDLE_ID" ] || [ "$BUNDLE_ID" = '$(PRODUCT_BUNDLE_IDENTIFIER)' ]; then
              RAW_PLIST=$(/usr/libexec/PlistBuddy -c "Print CFBundleIdentifier" ios/Runner/Info.plist 2>/dev/null)
              if [ "$RAW_PLIST" != '$(PRODUCT_BUNDLE_IDENTIFIER)' ] && [ -n "$RAW_PLIST" ]; then
                BUNDLE_ID="$RAW_PLIST"
              fi
            fi

            if [ -z "$BUNDLE_ID" ] || [ "$BUNDLE_ID" = '$(PRODUCT_BUNDLE_IDENTIFIER)' ]; then
              echo "❌ Could not detect valid Bundle ID"
              exit 1
            else
              echo "✅ Detected bundle-id: $BUNDLE_ID"
            fi
          fi

          echo "bundle-id=$BUNDLE_ID" >> $GITHUB_OUTPUT

      # ── Run Fastlane Match (readonly on CI) ────────────────────────────────
      - name: Run Fastlane Match
        env:
          REPO_NAME: ${{ steps.config.outputs.repo_name }}
          MATCH_PASSWORD: ${{ steps.config.outputs.match_password }}
          MATCH_KEYCHAIN_PASSWORD: ${{ steps.config.outputs.match_password }}
          CERTIFICATES_REPO_TOKEN: ${{ secrets.CERTIFICATES_REPO_TOKEN }}
          APPSTORE_ACCOUNT_ID: ${{ secrets.APPSTORE_ACCOUNT_ID }}
        run: |
          echo "🔐 Running Fastlane Match..."
          echo "  - Repo: ${REPO_NAME}"
          echo "  - App Identifier: ${{ steps.detect-bundle.outputs.bundle-id }}"
          echo "  - Branch: ${APPSTORE_ACCOUNT_ID}"
          echo "  - Password Length: ${#MATCH_PASSWORD}"

          fastlane match appstore \
            --git_url "https://x-access-token:${CERTIFICATES_REPO_TOKEN}@github.com/${REPO_NAME}.git" \
            --git_branch "${APPSTORE_ACCOUNT_ID}" \
            --app_identifier "${{ steps.detect-bundle.outputs.bundle-id }}" \
            --api_key_path /tmp/api_key.json \
            --readonly \
            --verbose

      # ── Optional Steps ─────────────────────────────────────────────────────

      - name: Run Pre-Build Script
        if: ${{ inputs.pre-build-script != '' }}
        run: ${{ inputs.pre-build-script }}

      - name: Rename App
        if: ${{ inputs.app-name != '' }}
        run: |
          dart pub global activate rename
          export PATH="$PATH":"$HOME/.pub-cache/bin"
          dart pub global run rename setAppName --value "${{ inputs.app-name }}" --targets ios

      - name: Update App Icon from URL
        if: ${{ inputs.icon-url != '' }}
        run: |
          dart pub global activate flutter_launcher_icons
          export PATH="$PATH":"$HOME/.pub-cache/bin"

          TEMP_ICON_DIR=".temp_icons"
          mkdir -p "$TEMP_ICON_DIR"
          TEMP_ICON_PATH="$TEMP_ICON_DIR/icon.png"

          echo "Downloading icon from: ${{ inputs.icon-url }}"
          curl -L -o "$TEMP_ICON_PATH" "${{ inputs.icon-url }}"

          if [ ! -f "$TEMP_ICON_PATH" ]; then
            echo "❌ Failed to download icon"
            exit 1
          fi

          cat > flutter_launcher_icons_temp.yaml <<EOF
          flutter_launcher_icons:
            android: false
            ios: true
            image_path: "$TEMP_ICON_PATH"
            remove_alpha_ios: true
          EOF

          dart pub global run flutter_launcher_icons -f flutter_launcher_icons_temp.yaml

          rm -f flutter_launcher_icons_temp.yaml
          rm -rf "$TEMP_ICON_DIR"

      - name: Detect Firebase Project ID
        id: detect-firebase
        run: |
          PROJECT_ID="${{ inputs.firebase-project-id }}"

          if [ -z "$PROJECT_ID" ]; then
            # Try .firebaserc first (projects.default)
            if [ -f ".firebaserc" ] && command -v jq &>/dev/null; then
              PROJECT_ID=$(jq -r '.projects.default // empty' .firebaserc 2>/dev/null || true)
              if [ -n "$PROJECT_ID" ]; then
                echo "✅ Auto-detected Firebase project from .firebaserc: $PROJECT_ID"
              fi
            fi
          fi

          if [ -z "$PROJECT_ID" ]; then
            # Try firebase.json — search for any projectId field (works with flutterfire, hosting, etc.)
            if [ -f "firebase.json" ] && command -v jq &>/dev/null; then
              PROJECT_ID=$(jq -r 'first(.. | .projectId? | select(type == "string" and length > 0)) // empty' firebase.json 2>/dev/null || true)
              if [ -n "$PROJECT_ID" ]; then
                echo "✅ Auto-detected Firebase project from firebase.json: $PROJECT_ID"
              fi
            fi
          fi

          if [ -z "$PROJECT_ID" ] && [ -f "firebase.json" ]; then
            echo "ℹ firebase.json found but could not extract project ID. Provide firebase-project-id input or add a default alias in .firebaserc."
          fi

          echo "project-id=$PROJECT_ID" >> "$GITHUB_OUTPUT"

      - name: Setup Node.js
        if: ${{ steps.detect-firebase.outputs.project-id != '' }}
        uses: actions/setup-node@v7
        with:
          node-version: '24'

      - name: Configure Firebase
        if: ${{ steps.detect-firebase.outputs.project-id != '' }}
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: |
          if [ -z "$FIREBASE_SERVICE_ACCOUNT" ]; then
            echo "⚠ Firebase Project ID provided but FIREBASE_SERVICE_ACCOUNT is empty. Skipping..."
            exit 0
          fi

          npm install -g firebase-tools
          dart pub global activate flutterfire_cli
          export PATH="$PATH":"$HOME/.pub-cache/bin"

          echo "$FIREBASE_SERVICE_ACCOUNT" > $HOME/service-account.json
          export GOOGLE_APPLICATION_CREDENTIALS="$HOME/service-account.json"

          flutterfire configure \
            --yes \
            --project=${{ steps.detect-firebase.outputs.project-id }} \
            --platforms=ios \
            --ios-bundle-id=${{ steps.detect-bundle.outputs.bundle-id }}

      - name: Find and Replace Text
        if: ${{ inputs.find-replace-list != '' }}
        run: |
          set +e

          echo "========================================="
          echo "Starting Find & Replace Operations"
          echo "========================================="

          OPERATION_NUM=0
          TOTAL_REPLACED=0

          while IFS='|' read -r SEARCH_PATH FIND_TEXT REPLACE_TEXT; do
            [[ -z "$SEARCH_PATH" ]] && continue

            ((OPERATION_NUM++))
            echo ""
            echo "--- Operation #$OPERATION_NUM ---"
            echo "Path: $SEARCH_PATH"
            echo "Find: $FIND_TEXT"
            echo "Replace: $REPLACE_TEXT"

            if [ ! -e "$SEARCH_PATH" ]; then
              echo "⚠ Warning: Path '$SEARCH_PATH' does not exist"
              continue
            fi

            if [ -f "$SEARCH_PATH" ]; then
              if grep -q "$FIND_TEXT" "$SEARCH_PATH"; then
                sed -i '' "s|$FIND_TEXT|$REPLACE_TEXT|g" "$SEARCH_PATH"
                echo "✓ Replaced in: $SEARCH_PATH"
                ((TOTAL_REPLACED++))
              else
                echo "⊘ Text not found in: $SEARCH_PATH"
              fi
            elif [ -d "$SEARCH_PATH" ]; then
              FILES_FOUND=$(find "$SEARCH_PATH" -type f \
                ! -path "*/.*" \
                ! -path "*/build/*" \
                ! -path "*/.dart_tool/*" \
                ! -name "*.ipa" \
                ! -name "*.a" \
                ! -name "*.dylib" \
                2>/dev/null)

              if [ -z "$FILES_FOUND" ]; then
                echo "⊘ No files found in directory"
              else
                REPLACED_COUNT=0
                while IFS= read -r file; do
                  if grep -q "$FIND_TEXT" "$file" 2>/dev/null; then
                    sed -i '' "s|$FIND_TEXT|$REPLACE_TEXT|g" "$file"
                    echo "✓ Replaced in: $file"
                    ((REPLACED_COUNT++))
                    ((TOTAL_REPLACED++))
                  fi
                done <<< "$FILES_FOUND"

                [ $REPLACED_COUNT -eq 0 ] && echo "⊘ Text not found in any files"
              fi
            fi
          done <<< "${{ inputs.find-replace-list }}"

          echo ""
          echo "========================================="
          echo "Total operations: $OPERATION_NUM"
          echo "Total files modified: $TOTAL_REPLACED"
          echo "========================================="

          set -e

      # ── Build ──────────────────────────────────────────────────────────────

      - name: Get dependencies
        env:
          GIT_TERMINAL_PROMPT: 0
        run: flutter pub upgrade

      - name: Run build_runner (if available)
        run: |
          if grep -q "build_runner:" pubspec.yaml; then
            echo "Running build_runner..."
            flutter pub run build_runner build --delete-conflicting-outputs
          else
            echo "build_runner not found, skipping..."
          fi

      - name: Run Tests
        if: ${{ inputs.run-tests }}
        shell: bash
        run: |
          # 1. Check commit message for test skip flag
          commit_msg=$(git log -1 --pretty=%B 2>/dev/null || true)
          if echo "$commit_msg" | grep -qiE "\[(skip|no)[- _]?(tests?|ci)\]"; then
            echo "⏩ Skipping tests: commit message contains skip instruction."
            exit 0
          fi

          # 2. Check if flutter_test is configured in pubspec.yaml
          if [ -f "pubspec.yaml" ] && ! grep -q "flutter_test" pubspec.yaml; then
            echo "ℹ️ 'flutter_test' dependency not found in pubspec.yaml. Skipping tests."
            exit 0
          fi

          # 3. Check if test directory exists and contains test files
          if [ ! -d "test" ] || [ -z "$(find test -name '*_test.dart' -print -quit 2>/dev/null)" ]; then
            echo "ℹ️ No test files found in test/ directory. Skipping tests."
            exit 0
          fi

          echo "🧪 Tests found and flutter_test configured. Running 'flutter test'..."
          flutter test

      - name: Install CocoaPods
        run: cd ios && pod update

      - name: Configure CocoaPods Code Signing
        run: |
          ruby -e '
            require "xcodeproj"
            project_path = "ios/Pods/Pods.xcodeproj"
            if File.exist?(project_path)
              project = Xcodeproj::Project.open(project_path)
              project.targets.each do |target|
                target.build_configurations.each do |config|
                  config.build_settings["EXPANDED_CODE_SIGN_IDENTITY"] = ""
                  config.build_settings["CODE_SIGNING_REQUIRED"] = "NO"
                  config.build_settings["CODE_SIGNING_ALLOWED"] = "NO"
                  config.build_settings["PROVISIONING_PROFILE_SPECIFIER"] = ""
                end
              end
              project.save
              puts "✓ Configured code signing for all Pods targets"
            end
          '

      - name: Resolve Swift Packages
        run: |
          cd ios
          xcodebuild -resolvePackageDependencies \
            -workspace Runner.xcworkspace \
            -scheme Runner \
            -scmProvider system \
            -packageAuthorizationProvider netrc
          echo "✓ Swift Package dependencies resolved"

      # ── Flutter build ios (no codesign) then xcodebuild archive ───────────
      - name: Flutter Build iOS (no codesign)
        run: flutter build ios --release --no-codesign

      - name: Write ExportOptions.plist
        run: |
          BUNDLE_ID="${{ steps.detect-bundle.outputs.bundle-id }}"
          TEAM_ID="${{ steps.config.outputs.team_id }}"

          # 1. Check if match/sigh environment variable is set
          VAR_NAME="sigh_${BUNDLE_ID//./_}_appstore_profile-name"
          PROFILE_NAME="${!VAR_NAME}"
          if [ -z "$PROFILE_NAME" ]; then
            VAR_NAME_DOT="sigh_${BUNDLE_ID}_appstore_profile-name"
            PROFILE_NAME="${!VAR_NAME_DOT}"
          fi

          # 2. Read profile name directly from installed mobileprovision files
          if [ -z "$PROFILE_NAME" ]; then
            PROVISIONING_PROFILES_DIR="$HOME/Library/MobileDevice/Provisioning Profiles"
            if [ -d "$PROVISIONING_PROFILES_DIR" ]; then
              for p in "$PROVISIONING_PROFILES_DIR"/*.mobileprovision; do
                if [ -f "$p" ]; then
                  PROV_APP_ID=$(security cms -D -i "$p" 2>/dev/null | /usr/libexec/PlistBuddy -c "Print :Entitlements:application-identifier" /dev/stdin 2>/dev/null || true)
                  if [[ "$PROV_APP_ID" == *"$BUNDLE_ID"* ]]; then
                    DETECTED_NAME=$(security cms -D -i "$p" 2>/dev/null | /usr/libexec/PlistBuddy -c "Print :Name" /dev/stdin 2>/dev/null || true)
                    if [ -n "$DETECTED_NAME" ]; then
                      PROFILE_NAME="$DETECTED_NAME"
                      echo "✓ Found matching installed profile: '$PROFILE_NAME'"
                      break
                    fi
                  fi
                fi
              done
            fi
          fi

          # 3. Fallback default
          if [ -z "$PROFILE_NAME" ]; then
            PROFILE_NAME="match AppStore ${BUNDLE_ID}"
          fi

          echo "PROFILE_NAME=${PROFILE_NAME}" >> $GITHUB_ENV
          echo "✓ Using Provisioning Profile: ${PROFILE_NAME}"

          cat > /tmp/ExportOptions.plist <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key>
            <string>app-store</string>
            <key>teamID</key>
            <string>${TEAM_ID}</string>
            <key>provisioningProfiles</key>
            <dict>
              <key>${BUNDLE_ID}</key>
              <string>${PROFILE_NAME}</string>
            </dict>
            <key>signingStyle</key>
            <string>manual</string>
            <key>stripSwiftSymbols</key>
            <true/>
            <key>uploadBitcode</key>
            <false/>
            <key>uploadSymbols</key>
            <true/>
          </dict>
          </plist>
          EOF

          echo "✓ ExportOptions.plist written:"
          cat /tmp/ExportOptions.plist

      - name: Xcode Archive
        run: |
          BUNDLE_ID="${{ steps.detect-bundle.outputs.bundle-id }}"
          TEAM_ID="${{ steps.config.outputs.team_id }}"
          echo "🚀 Starting Xcode Archive..."
          echo "  - Bundle ID: ${BUNDLE_ID}"
          echo "  - Team ID: ${TEAM_ID}"
          echo "  - Profile Specifier: ${PROFILE_NAME}"

          set -o pipefail
          xcodebuild archive \
            -workspace ios/Runner.xcworkspace \
            -scheme Runner \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath build/ios/archive/Runner.xcarchive \
            -scmProvider system \
            -packageAuthorizationProvider netrc \
            CODE_SIGN_STYLE=Manual \
            DEVELOPMENT_TEAM="${TEAM_ID}" \
            CODE_SIGN_IDENTITY="Apple Distribution" \
            2>&1 | tee /tmp/xcodebuild-archive.log | xcpretty || {
              ARCHIVE_EXIT=$?
              echo "❌ xcodebuild archive failed with exit code $ARCHIVE_EXIT"
              echo "================ RAW XCODEBUILD LOG (Last 120 lines) ================"
              tail -n 120 /tmp/xcodebuild-archive.log
              echo "====================================================================="
              exit $ARCHIVE_EXIT
            }

          # تأكد إن الـ archive اتعمل
          if [ ! -d "build/ios/archive/Runner.xcarchive" ]; then
            echo "❌ Archive directory not found at build/ios/archive/Runner.xcarchive!"
            exit 1
          fi
          echo "✅ Archive created successfully"

      - name: Export IPA
        run: |
          set -o pipefail
          xcodebuild -exportArchive \
            -archivePath build/ios/archive/Runner.xcarchive \
            -exportPath build/ios/ipa \
            -exportOptionsPlist /tmp/ExportOptions.plist \
            -allowProvisioningUpdates \
            2>&1 | tee /tmp/xcodebuild-export.log | xcpretty || {
              EXPORT_EXIT=$?
              echo "❌ xcodebuild exportArchive failed with exit code $EXPORT_EXIT"
              echo "================ RAW EXPORT LOG (Last 120 lines) ================"
              tail -n 120 /tmp/xcodebuild-export.log
              echo "================================================================="
              exit $EXPORT_EXIT
            }

      # ── Prepare and Upload ─────────────────────────────────────────────────
      - name: Prepare Release Files
        run: |
          mkdir -p release-files
          BUNDLE_ID="${{ steps.detect-bundle.outputs.bundle-id }}"

          IPA_FILE=$(find build/ios/ipa -name "*.ipa" | head -n 1)
          if [ -z "$IPA_FILE" ]; then
            echo "❌ IPA not found!"
            exit 1
          fi

          cp "$IPA_FILE" "release-files/${BUNDLE_ID}-release.ipa"

          echo ""
          echo "=== Release Files ==="
          ls -lh release-files/

      - name: Upload IPA to Artifacts
        if: ${{ !startsWith(github.ref, 'refs/tags/') }}
        uses: actions/upload-artifact@v7
        with:
          name: ${{ steps.detect-bundle.outputs.bundle-id }}-ipa
          path: release-files/*-release.ipa
          if-no-files-found: error
          retention-days: 30

      - name: Release to GitHub
        uses: softprops/action-gh-release@v3
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: release-files/*-release.ipa
          body: |
            ## 📦 iOS Release Build

            ### Files:
            - **IPA**: App Store distribution file

            ### Build Info:
            - Flutter: ${{ steps.fvm-config-action.outputs.FLUTTER_VERSION }}
            - Channel: ${{ steps.fvm-config-action.outputs.FLUTTER_CHANNEL }}
            - Bundle ID: ${{ steps.detect-bundle.outputs.bundle-id }}
            - App Name: ${{ inputs.app-name || 'Default' }}
            - Icon Updated: ${{ inputs.icon-url != '' }}
            - Commit: ${{ github.sha }}
          fail_on_unmatched_files: false
